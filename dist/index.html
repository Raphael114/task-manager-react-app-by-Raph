<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAPH Task Manager</title>
    <script type="module" crossorigin src="/assets/index-BYvvj--6.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DiqMPmO6.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply saved theme before React mounts to prevent flash -->
    <script>
      try {
        const t = localStorage.getItem('theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </body>
</html>
